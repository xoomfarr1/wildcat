[tool.poetry]
name = "wildcat-diagnostics"
version = "0.1.0"
description = "Multi-connector, multi-vehicle diagnostic and programming toolchain"
authors = ["Zach Monroe"]
license = "GPL-3.0"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.7"
pyserial = "^3.5"
requests = "^2.31"
loguru = "^0.7"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-cov = "^5.0"
ruff = "^0.4"
mypy = "^1.8"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
