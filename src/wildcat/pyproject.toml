name = "wildcat"
version = "0.1.0"
description = "Multi-connector, multi-vehicle diagnostic toolchain"
authors = ["Zach Monroe"]
license = "GPL-3.0"

[tool.poetry]
python = "^3.11"
pydantic = "^2.7"
pyserial = "^3.5"
requests = "^2.31"
loguru = "^0.7"
PySide6 = {version = "^6.6", optional = true}
pyinstaller = {version = "^6.6", optional = true}

[tool.poetry.extras]
gui = ["PySide6"]
packaging = ["pyinstaller"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-cov = "^5.0"
ruff = "^0.4"
mypy = "^1.8"
